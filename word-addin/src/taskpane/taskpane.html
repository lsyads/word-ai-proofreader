<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Word AI 审校助手</title>

    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>

    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css"/>

    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m app-shell ms-Fabric">
    <header class="app-header ms-bgColor-neutralLighter">
        <img width="52" height="52" src="../../assets/logo-filled.png" alt="Word AI 审校助手" />
        <div>
            <h1 class="ms-font-xl">Word AI 审校助手</h1>
            <p class="ms-font-s">MVP 能力验证</p>
        </div>
    </header>

    <main id="app-body" class="app-main">
        <section class="status-panel" aria-live="polite">
            <h2 class="ms-font-l">AI 审校</h2>
            <p id="message" class="message">请选择 Word 文档中的一段文字，然后开始审校。</p>
        </section>

        <section class="actions">
            <label class="field-label" for="proofread-mode">审校模式</label>
            <select id="proofread-mode" class="control-select">
                <option value="fast">快速模式</option>
                <option value="thinking">思考模式</option>
            </select>

            <label class="field-label" for="provider-api">AI API</label>
            <select id="provider-api" class="control-select">
                <option value="responses">Responses</option>
                <option value="chat">Chat</option>
            </select>

            <label class="field-label" for="application-mode">应用方式</label>
            <select id="application-mode" class="control-select">
                <option value="comment">批注模式</option>
                <option value="revision">修订模式</option>
            </select>

            <button id="proofread" class="ms-Button ms-Button--primary" type="button">
                <span class="ms-Button-label">AI 审校</span>
            </button>
            <button id="new-conversation" class="ms-Button" type="button">
                <span class="ms-Button-label">新建对话</span>
            </button>
        </section>

        <section class="progress-panel">
            <h2 class="ms-font-m">运行过程</h2>
            <div id="progress" class="progress-empty">尚未开始审校</div>
        </section>

        <section class="result-panel">
            <h2 class="ms-font-m">审校结果</h2>
            <div id="result" class="result-empty">尚未开始审校</div>
        </section>

        <section class="history-panel">
            <h2 class="ms-font-m">历史记录</h2>
            <div class="history-actions">
                <button id="export-history" class="ms-Button" type="button">
                    <span class="ms-Button-label">另存为</span>
                </button>
                <button id="import-history" class="ms-Button" type="button">
                    <span class="ms-Button-label">导入</span>
                </button>
                <button id="clear-history" class="ms-Button" type="button">
                    <span class="ms-Button-label">清空</span>
                </button>
                <input id="history-file" type="file" accept="application/json,.json" hidden />
            </div>
            <div id="history" class="history-empty">暂无历史记录</div>
        </section>
    </main>
</body>

</html>
