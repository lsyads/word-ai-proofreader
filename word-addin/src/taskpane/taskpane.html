<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>DocPilot V2</title>

    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <link rel="stylesheet" href="https://res-1.cdn.office.net/files/fabric-cdn-prod_20230815.002/office-ui-fabric-core/11.1.0/css/fabric.min.css" />
    <link href="taskpane.css" rel="stylesheet" type="text/css" />
</head>

<body class="ms-font-m app-shell ms-Fabric">
    <header class="app-header">
        <img width="44" height="44" src="../../assets/logo-filled.png" alt="DocPilot" />
        <div>
            <h1 class="ms-font-xl">DocPilot V2</h1>
            <p class="ms-font-s">出版审校工作台</p>
        </div>
    </header>

    <main id="app-body" class="app-main">
        <section class="status-panel" aria-live="polite">
            <p id="message" class="message">选择审校来源，填写书名，然后开始审校。</p>
        </section>

        <section class="workspace-panel">
            <div class="panel-heading">
                <h2 class="ms-font-m">审校设置</h2>
                <span id="project-badge" class="status-badge">未开始</span>
            </div>

            <label class="field-label" for="source-type">审校来源</label>
            <select id="source-type" class="control-select">
                <option value="selection">当前选区</option>
                <option value="docx">全书 DOCX</option>
            </select>

            <div id="docx-source-panel" class="source-panel" hidden>
                <label class="field-label" for="docx-file">DOCX 文件</label>
                <input id="docx-file" class="control-input" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />
                <p id="docx-file-summary" class="field-hint">尚未选择 DOCX。</p>
            </div>

            <label class="field-label" for="book-title">书名</label>
            <input id="book-title" class="control-input" type="text" autocomplete="off" required />

            <label class="field-label" for="book-introduction">书籍背景信息</label>
            <textarea id="book-introduction" class="control-textarea" rows="3"></textarea>

            <label class="field-label" for="review-goal">审校目标</label>
            <textarea id="review-goal" class="control-textarea compact" rows="3">完成出版审校，找出明显错别字、语病、体例问题和上下文一致性风险。</textarea>

            <details class="details-panel">
                <summary>高级设置</summary>
                <div class="control-grid">
                    <label>
                        <span class="field-label">AI 配置</span>
                        <select id="ai-profile" class="control-select">
                            <option value="default">Default AI (.env)</option>
                        </select>
                    </label>
                    <label>
                        <span class="field-label">AI API</span>
                        <select id="provider-api" class="control-select">
                            <option value="responses">Responses</option>
                            <option value="chat">Chat</option>
                        </select>
                    </label>
                    <label>
                        <span class="field-label">审校模式</span>
                        <select id="proofread-mode" class="control-select">
                            <option value="fast">快速审校</option>
                            <option value="thinking">深度审校</option>
                        </select>
                    </label>
                    <label>
                        <span class="field-label">Temperature</span>
                        <input id="temperature" class="control-input" type="number" min="0" max="1.5" step="0.1" value="0.6" />
                    </label>
                    <label>
                        <span class="field-label">写回模式</span>
                        <select id="application-mode" class="control-select">
                            <option value="comment">批注模式</option>
                            <option value="revision">修订+批注</option>
                        </select>
                    </label>
                    <label class="checkbox-field inline-checkbox">
                        <input id="fallback-summary-truncate-enabled" type="checkbox" />
                        <span>截断汇总批注</span>
                    </label>
                </div>
                <label class="checkbox-field">
                    <input id="reasoning-enabled" type="checkbox" />
                    <span>启用模型深度思考</span>
                </label>
            </details>

            <button id="start-review" class="ms-Button ms-Button--primary full-width-button" type="button">
                <span class="ms-Button-label">开始审校</span>
            </button>
        </section>

        <section class="workspace-panel">
            <div class="panel-heading">
                <h2 class="ms-font-m">最近项目</h2>
                <button id="refresh-projects" class="ms-Button" type="button">
                    <span class="ms-Button-label">刷新项目列表</span>
                </button>
            </div>
            <div id="recent-projects" class="workspace-empty">暂无最近项目。</div>
        </section>

        <section class="workspace-panel compact-panel">
            <div id="project-summary" class="workspace-empty">暂无审校项目。</div>
            <div class="button-row project-action-row">
                <button id="refresh-current-project" class="ms-Button" type="button" disabled>
                    <span class="ms-Button-label">刷新当前项目</span>
                </button>
                <button id="continue-waiting" class="ms-Button" type="button" disabled hidden>
                    <span class="ms-Button-label">继续等待</span>
                </button>
            </div>
        </section>

        <section class="workspace-panel">
            <div class="panel-heading">
                <h2 class="ms-font-m">候选问题</h2>
                <select id="candidate-filter" class="control-select narrow">
                    <option value="all">全部</option>
                    <option value="pending">待确认</option>
                    <option value="approved">已批准</option>
                    <option value="rejected">已拒绝</option>
                    <option value="written">已写回</option>
                </select>
                <select id="candidate-pass-filter" class="control-select narrow" hidden>
                    <option value="all">全部阶段</option>
                </select>
            </div>
            <div id="candidate-summary" class="summary-line">暂无候选问题。</div>
            <div id="candidates" class="workspace-empty">开始审校后显示候选问题。</div>
            <div class="pagination-row">
                <button id="candidate-prev-page" class="ms-Button" type="button" disabled>
                    <span class="ms-Button-label">上一页</span>
                </button>
                <span id="candidate-page-summary" class="pagination-summary">第 0/0 页</span>
                <button id="candidate-next-page" class="ms-Button" type="button" disabled>
                    <span class="ms-Button-label">下一页</span>
                </button>
            </div>
            <div class="button-row">
                <button id="approve-all" class="ms-Button" type="button" disabled>
                    <span class="ms-Button-label">批准全部</span>
                </button>
                <button id="reject-all" class="ms-Button" type="button" disabled>
                    <span class="ms-Button-label">拒绝全部</span>
                </button>
            </div>
            <div class="button-row">
                <button id="writeback" class="ms-Button ms-Button--primary" type="button" disabled>
                    <span class="ms-Button-label">写回已批准</span>
                </button>
                <button id="download-docx" class="ms-Button" type="button" disabled>
                    <span class="ms-Button-label">下载结果 DOCX</span>
                </button>
            </div>
            <div id="report" class="workspace-empty compact-report">暂无写回报告。</div>
        </section>

        <section class="workspace-panel">
            <details class="details-panel">
                <summary>高级信息</summary>
                <div class="advanced-section">
                    <h3 class="ms-font-s">文档地图</h3>
                    <div id="document-map" class="workspace-empty">暂无文档地图。</div>
                </div>
                <div class="advanced-section">
                    <h3 class="ms-font-s">审校计划</h3>
                    <div id="review-plan" class="workspace-empty">暂无审校计划。</div>
                </div>
                <div class="advanced-section">
                    <div class="panel-heading">
                        <h3 class="ms-font-s">运行过程</h3>
                        <button id="refresh-trace" class="ms-Button" type="button" disabled>
                            <span class="ms-Button-label">刷新当前项目</span>
                        </button>
                    </div>
                    <div id="run-trace" class="workspace-empty">暂无运行记录。</div>
                </div>
                <div class="advanced-section">
                    <h3 class="ms-font-s">本书规则</h3>
                    <div id="project-memory" class="workspace-empty">暂无本书规则。</div>
                </div>
            </details>
        </section>

        <section class="workspace-panel debug-panel">
            <div class="panel-heading">
                <h2 class="ms-font-m">调试日志</h2>
                <button id="clear-debug-log" class="ms-Button" type="button">
                    <span class="ms-Button-label">清空</span>
                </button>
            </div>
            <div id="debug-log" class="debug-log" aria-live="polite"></div>
        </section>
    </main>

    <div id="confirm-dialog" class="confirm-dialog-overlay" hidden>
        <div class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-dialog-title">
            <h2 id="confirm-dialog-title" class="ms-font-m">请确认</h2>
            <p id="confirm-dialog-description" class="confirm-dialog-description"></p>
            <div class="confirm-dialog-actions">
                <button id="confirm-dialog-cancel" class="ms-Button" type="button">
                    <span class="ms-Button-label">取消</span>
                </button>
                <button id="confirm-dialog-submit" class="ms-Button ms-Button--primary" type="button">
                    <span class="ms-Button-label">确认</span>
                </button>
            </div>
        </div>
    </div>
</body>

</html>
